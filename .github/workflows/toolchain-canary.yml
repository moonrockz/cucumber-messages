name: Toolchain Canary

# CI pins a MoonBit toolchain version, and Renovate cannot track upstream
# releases. Run the checks on a schedule against the latest toolchain so a
# toolchain change (a new deprecation warning or a break) shows up here before
# we bump the pin.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hustcer/setup-moonbit@v1.25

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Show toolchain versions
        run: moon version --all

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: mise run lint:fmt

      - name: Check code (warnings are errors)
        run: mise run lint:strict

      - name: Run unit tests
        run: mise run test:unit
