name: Toolchain Canary

# CI installs the latest MoonBit toolchain on every run, and Renovate cannot
# track it. Run the checks on a schedule so a toolchain change (a new
# deprecation warning or a break) shows up here, not on an unrelated PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hustcer/setup-moonbit@v1.25

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Show toolchain versions
        run: moon version --all

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: mise run lint:fmt

      - name: Check code (warnings are errors)
        run: mise run lint:strict

      - name: Run unit tests
        run: mise run test:unit
