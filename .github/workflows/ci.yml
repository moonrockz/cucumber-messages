name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hustcer/setup-moonbit@v1.25

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Show toolchain versions
        run: moon version --all

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: mise run lint:fmt

      - name: Check code
        run: mise run lint:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hustcer/setup-moonbit@v1.25

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Run unit tests
        run: mise run test:unit
