name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hustcer/setup-moonbit@v1.25

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Show toolchain versions
        run: moon version --all

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: mise run lint:fmt

      - name: Check code
        run: mise run lint:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hustcer/setup-moonbit@v1.25

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Run unit tests
        run: mise run test:unit

  # The only check that the main branch ruleset requires, so job renames and
  # new jobs need no settings change. Add every new job to `needs`.
  #
  # `if: always()` is required: without it this job is skipped when a needed
  # job fails, and GitHub counts a skipped required check as passed. Failed
  # and cancelled jobs fail it.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - unit-tests
    steps:
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Some CI jobs did not pass"
            echo "$failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
